[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prop-firm-calendar"
version = "0.9.0"
description = "Prop-firm maintenance windows and market closures (FTMO, Topstep, Blueberry Funded, E8 Markets) as an ICS feed or Google Calendar"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bogdan-Alexandru Truta" }]
keywords = ["prop-firm", "ftmo", "topstep", "trading", "ics", "google-calendar", "maintenance"]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "google-genai>=1.0",
  "openai>=1.40",
  "tzdata>=2024.1",
]

[project.urls]
Repository = "https://github.com/Bogzx/prop-firm-calendar"

[project.scripts]
prop-firm-calendar = "prop_firm_calendar.cli:entry"
# The pre-0.9 name. The Docker image, cron lines and systemd units in the wild
# call it; it stays for as long as they might.
ftmo-calendar = "prop_firm_calendar.cli:entry"

[project.optional-dependencies]
# ruff and mypy are pinned exactly, to the versions in requirements.lock: both
# gate CI, and both add rules in minor releases. Unpinned, someone else's
# release turns a contributor's green build red on a branch they never touched
# — which is precisely what ruff 0.16 did here by starting to format fenced
# code blocks inside Markdown. Bump these deliberately, with the lock file.
dev = ["pytest>=8", "ruff==0.15.16", "mypy==2.1.0", "types-requests"]

[tool.hatch.build.targets.wheel]
# ftmo_calendar is the deprecated import name: an alias package that resolves
# every `ftmo_calendar.x` to the `prop_firm_calendar.x` module object.
packages = ["src/prop_firm_calendar", "src/ftmo_calendar"]
# Source profiles are data, not code: without this a wheel install has no
# profiles directory and every run fails on a missing ftmo.toml.
artifacts = ["src/prop_firm_calendar/sources/profiles/*.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/prop_firm_calendar/web.py" = ["E501"]  # inline HTML/CSS template reads better unwrapped

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_llm: calls a real LLM API and costs money; skipped unless PFC_LIVE_EVAL=1 and LLM_API_KEY are set",
]

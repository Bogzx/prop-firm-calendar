[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ftmo-calendar"
version = "0.8.1"
description = "Sync FTMO trading updates (maintenance windows, market closures) to Google Calendar"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bogdan-Alexandru Truta" }]
keywords = ["ftmo", "trading", "google-calendar", "maintenance"]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "google-genai>=1.0",
  "openai>=1.40",
  "tzdata>=2024.1",
]

[project.urls]
Repository = "https://github.com/Bogzx/prop-firm-calendar"

[project.scripts]
ftmo-calendar = "ftmo_calendar.cli:entry"

[project.optional-dependencies]
# ruff and mypy are pinned exactly, to the versions in requirements.lock: both
# gate CI, and both add rules in minor releases. Unpinned, someone else's
# release turns a contributor's green build red on a branch they never touched
# — which is precisely what ruff 0.16 did here by starting to format fenced
# code blocks inside Markdown. Bump these deliberately, with the lock file.
dev = ["pytest>=8", "ruff==0.15.16", "mypy==2.1.0", "types-requests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ftmo_calendar"]
# Source profiles are data, not code: without this a wheel install has no
# profiles directory and every run fails on a missing ftmo.toml.
artifacts = ["src/ftmo_calendar/sources/profiles/*.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ftmo_calendar/web.py" = ["E501"]  # inline HTML/CSS template reads better unwrapped

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

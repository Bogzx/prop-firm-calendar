services:
  ftmo-calendar:
    build: .
    restart: unless-stopped
    ports:
      # Published on all interfaces so `http://your-vps:8080/feed.ics` works out
      # of the box. Override the host port with PORT=9000 in .env if 8080 is
      # taken. To put it behind a reverse proxy instead, bind loopback only —
      # see docs/DEPLOYMENT.md ("Binding to loopback behind a reverse proxy").
      - "${PORT:-8080}:8080"
    env_file:
      - .env # LLM_API_KEY, optional DISCORD_WEBHOOK_URL / TELEGRAM_* / WEBHOOK_URL vars
    volumes:
      # Put config.toml and service_account.json (or token.json) in ./data.
      # state.json, stats.json and the ICS feed are written there too.
      #
      # The container runs as uid 1000. If ./data is owned by another uid the
      # app cannot persist anything: run `chown -R 1000:1000 data` once. Serve
      # mode refuses to start on an unwritable data directory rather than
      # running healthy while losing every write.
      - ./data:/data
